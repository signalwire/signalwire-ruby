name: Publish Release
env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout signalwire-ruby
        uses: actions/checkout@v7
        with:
          path: signalwire-ruby

      - name: Checkout porting-sdk (mock_relay + mock_signalwire test harnesses)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          fetch-depth: 1
          # Publish always builds against porting-sdk main — deliberately NOT the
          # coordinated-pass PORTING_SDK_REF variable, so a release can never ship from
          # an unmerged wave branch (see porting-sdk/COORDINATED_PASS.md).
          ref: main
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.9'
          bundler-cache: true
          working-directory: signalwire-ruby

      - name: Set up Python (for porting-sdk mock servers)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      # ruff backs the PY-LINT / PY-FMT gates over the hand-written Python in
      # scripts/ (the 5 code generators, the surface enumerator, _gen_format.py).
      # scripts/_env.sh fails LOUD when ruff is absent rather than skipping, so
      # the gate cannot pass vacuously on a runner that lacks it.
      - name: Install ruff (PY-LINT / PY-FMT gates)
        run: pip install ruff

      - name: Run CI gate script (full run-ci.sh — the same gate set as PR CI)
        working-directory: signalwire-ruby
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-ci.sh

      - name: Build and push gem
        working-directory: signalwire-ruby
        run: |
          mkdir -p ~/.gem
          echo -e "---\n:rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem build signalwire-sdk.gemspec
          gem push signalwire-sdk-*.gem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
