name: Surface Audit (Layer B)
# Enforces symbol-level parity between this Ruby port and the Python
# reference that lives in the porting-sdk repo. Any drift — a Python symbol
# missing from the port without an entry in PORT_OMISSIONS.md, or a
# port-only symbol without an entry in PORT_ADDITIONS.md — fails the job.
#
# See:
#   - scripts/enumerate_surface.rb           (produces port_surface.json)
#   - PORT_OMISSIONS.md / PORT_ADDITIONS.md  (deliberate deltas)
#   - ../porting-sdk/scripts/diff_port_surface.py (the diff tool)
#   - ../porting-sdk/python_surface.json     (the canonical reference)

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:30 UTC so we catch upstream python_surface.json drift
    # within 24 hours.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  surface-audit:
    name: Verify symbol-level parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signalwire-ruby
        uses: actions/checkout@v5

      - name: Checkout porting-sdk alongside
        uses: actions/checkout@v5
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.9'
          bundler-cache: true

      - name: Set up Python (for the diff tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify port_surface.json is current
        # Uses the script's --check mode, which parses both files and compares
        # the structural surface (ignoring generated_from / ruby_version and
        # JSON-gem whitespace quirks across Ruby versions). A plain `git diff`
        # false-positives on the embedded git SHA and on empty-array
        # formatting differences between json gem 2.6.x (CI) and 2.12+ (local).
        #
        # --python-surface is passed explicitly so the script's class→module
        # resolver maps onto the canonical Python paths; without it, every
        # class falls back to a Ruby-namespace path and the next step's diff
        # against python_surface.json would report ~hundreds of false misses.
        run: |
          if bundle check >/dev/null 2>&1; then
            bundle exec ruby scripts/enumerate_surface.rb \
              --python-surface porting-sdk/python_surface.json \
              --check --output port_surface.json
          else
            ruby scripts/enumerate_surface.rb \
              --python-surface porting-sdk/python_surface.json \
              --check --output port_surface.json
          fi

      - name: Diff against python_surface.json
        run: |
          python3 porting-sdk/scripts/diff_port_surface.py \
              --reference porting-sdk/python_surface.json \
              --port-surface port_surface.json \
              --omissions PORT_OMISSIONS.md \
              --additions PORT_ADDITIONS.md
